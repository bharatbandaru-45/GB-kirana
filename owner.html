
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GB KIRANA - Owner Dashboard</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f0f7f2;
      color: #173d2b;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }
    .panel {
      background: white;
      width: 100%;
      max-width: 420px;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 8px 30px #173d2b18;
    }
    h1 { text-align: center; color: #176b3a; }
    p { text-align: center; color: #637568; }
    input, button {
      width: 100%;
      padding: 13px;
      margin-top: 14px;
      border-radius: 8px;
      font-size: 16px;
    }
    input { border: 1px solid #ccd9cf; }
    button {
      border: 0;
      background: #176b3a;
      color: white;
      cursor: pointer;
    }
    button:hover { background: #10542d; }
    #message { font-size: 14px; }
  </style>
</head>
<body>
  <main class="panel">
    <h1>GB KIRANA</h1>
    <p>Owner Login</p>

    <form id="loginForm">
      <input id="email" type="email" placeholder="Owner Email" required>
      <input id="password" type="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>

    <p id="message"></p>
  </main>
  
<script type="module">
  import { auth } from "./firebase.js";
  import {
    signInWithEmailAndPassword
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

  const form = document.getElementById("loginForm");
  const message = document.getElementById("message");

  form.addEventListener("submit", async (event) => {
    event.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    message.textContent = "Logging in...";

    try {
      await signInWithEmailAndPassword(auth, email, password);
      message.textContent = "Login successful!";
      window.location.href = "dashboard.html";
    } catch (error) {
      message.textContent = "Login failed. Check your email and password.";
    }
  });
</script>
</body>
</html>

</body>
</html>
