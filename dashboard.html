
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GB KIRANA - Owner Dashboard</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 25px;
      font-family: Arial, sans-serif;
      background: #f0f7f2;
      color: #173d2b;
    }
    .container {
      max-width: 650px;
      margin: 30px auto;
      background: white;
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 8px 30px #173d2b18;
    }
    h1 { color: #176b3a; }
    input, select, button {
      width: 100%;
      padding: 13px;
      margin: 10px 0;
      border: 1px solid #ccd9cf;
      border-radius: 8px;
      font-size: 16px;
    }
    button {
      background: #176b3a;
      color: white;
      border: none;
      cursor: pointer;
    }
    #logout { background: #555; }
    #message { color: #176b3a; }
  </style>
</head>
<body>
  <main class="container">
    <h1>GB KIRANA</h1>
    <h2>Owner Dashboard</h2>

    <p id="status">Checking login...</p>

    <form id="productForm" hidden>
      <h3>Add New Product</h3>

      <input id="name" placeholder="Product name" required>

      <input id="price" type="number"
        min="0" step="0.01" placeholder="Price in ₹" required>

      <select id="category" required>
        <option value="">Select category</option>
        <option value="Grocery">Grocery</option>
        <option value="Snacks">Snacks</option>
        <option value="Drinks">Drinks</option>
        <option value="Dairy">Dairy</option>
        <option value="Personal Care">Personal Care</option>
        <option value="Other">Other</option>
      </select>

      <select id="available">
        <option value="true">Available</option>
        <option value="false">Not available</option>
      </select>

      <button type="submit">Save Product</button>
    </form>

    <p id="message"></p>
    <button id="logout" hidden>Logout</button>
  </main>

  <script type="module">
    import { auth, db } from "./firebase.js";

    import {
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

    import {
      addDoc,
      collection,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const form = document.getElementById("productForm");
    const status = document.getElementById("status");
    const message = document.getElementById("message");
    const logout = document.getElementById("logout");

    onAuthStateChanged(auth, (user) => {
      if (user) {
        status.textContent = "Owner logged in";
        form.hidden = false;
        logout.hidden = false;
      } else {
        window.location.replace("owner.html");
      }
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const user = auth.currentUser;
      if (!user) return;

      const name = document.getElementById("name").value.trim();
      const price = Number(document.getElementById("price").value);
      const category = document.getElementById("category").value;
      const available =
        document.getElementById("available").value === "true";

      if (!name || !category || !Number.isFinite(price) || price < 0) {
        message.textContent = "Please enter valid product details.";
        return;
      }

      message.textContent = "Saving product...";

      try {
        await addDoc(collection(db, "products"), {
          name,
          price,
          category,
          available,
          createdAt: serverTimestamp()
        });

        message.textContent = "Product saved successfully!";
        form.reset();
      } catch (error) {
        message.textContent = "Error saving product: " + error.message;
      }
    });

    logout.addEventListener("click", async () => {
      await signOut(auth);
      window.location.replace("owner.html");
    });
  </script>
</body>
</html>
